version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    groups:
      aws: { patterns: ['@aws-sdk/*', 'aws-cdk*'] }
      menores: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
